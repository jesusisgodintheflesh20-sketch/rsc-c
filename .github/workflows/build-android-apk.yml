name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'org.scape2003.mudclient/**'
      - 'src/**'
      - 'offline/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: org.scape2003.mudclient

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test embedded engine and persistent character
        working-directory: .
        run: |
          python3 offline/tests/client-config.py
          git diff --exit-code -- org.scape2003.mudclient/app/src/offline/assets/config46.jag
          cmake -S offline -B /tmp/sundae-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/sundae-build -j 4
          python3 offline/tests/smoke.py /tmp/sundae-build/sundae

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install required packages
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;25.2.9519653' \
            'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build and debug-sign APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleOfflineDebug
          test -s app/build/outputs/apk/offline/debug/app-offline-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/offline/debug/app-offline-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 app/build/outputs/apk/offline/debug/app-offline-debug.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: rsc-offline-2001-apk
          path: org.scape2003.mudclient/app/build/outputs/apk/offline/debug/app-offline-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rsc-offline-2001-apk
          path: org.scape2003.mudclient/app/build/outputs/apk/offline/debug/
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play offline on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: .
          script: bash offline/tests/android-smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-android-test
          path: android-test/
          if-no-files-found: ignore

