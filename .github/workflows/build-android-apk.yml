name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'org.scape2003.mudclient/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: org.scape2003.mudclient

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;24.0.8215888'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/24.0.8215888" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/24.0.8215888" >> "$GITHUB_ENV"

      - name: Build and debug-sign APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2003scape-installable-apk
          path: org.scape2003.mudclient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
