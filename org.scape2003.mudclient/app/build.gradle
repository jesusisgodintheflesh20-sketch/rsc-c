def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.scape2003.mudclient"
    }
    androidResources { noCompress 'm4a' }
    compileSdkVersion 34
    ndkVersion '25.2.9519653'
    flavorDimensions 'mode'
    productFlavors {
        online { dimension 'mode'; manifestPlaceholders = [appLabel: '2003Scape'] }
        offline {
            dimension 'mode'
            applicationIdSuffix '.offline'
            manifestPlaceholders = [appLabel: 'RSC Offline (2001)']
            externalNativeBuild { ndkBuild { cFlags '-DOFFLINE_WORLD' } }
        }
    }
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-19"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                cFlags "-Ofast -DRENDER_SW -DSDL2"
            }
        }
    }
    signingConfigs {
        debug {
            // Deliberately public debug-only key: updates keep local offline saves.
            storeFile file('../../offline/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }

    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.scape2003.mudclient.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    offlineImplementation project(':offline-server')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
